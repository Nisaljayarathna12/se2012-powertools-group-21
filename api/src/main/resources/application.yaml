spring:
  application:
    name: powertools
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:powertools}?createDatabaseIfNotExist=true&useSSL=${DB_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate.type.preferred_uuid_jdbc_type: CHAR
    open-in-view: false
  flyway:
    enabled: true
    ignore-migration-patterns: "*:missing"

app:
  jwt:
    secret: ${JWT_SECRET:powertools-super-secret-jwt-signing-key-change-me-in-production-2026}
    expiration-ms: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  info:
    title: PowerTools API
    description: REST API for the PowerTools e-commerce platform
    version: 0.0.1-SNAPSHOT